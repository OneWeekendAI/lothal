name: msix-manifest-check

# Runs MakeAppx against the manifest and nothing else.
#
# WHY THIS IS SEPARATE FROM windows-build
#
# The full pipeline is ~9 minutes: a Rust build, 986 tests, and two Godot exports. Packaging sits
# at the very end of it, so every mistake in the manifest — a typo, a logo path, one of MakeAppx's
# unpublished cross-attribute validation rules — costs that entire run to discover, and costs it
# again on the next attempt. Three consecutive red runs on the first submission were exactly this.
#
# MakeAppx does not care what is inside the package. It validates the manifest, then zips whatever
# it was pointed at. So this job stages three files of dummy bytes under the names the real export
# produces and packs those. If the manifest is valid, this passes in about a minute; if it is not,
# the error is the same one the real pipeline would have printed.
#
# What it deliberately does NOT prove: that the app runs, that the native core shipped, or that
# the package contents are correct. Only windows-build produces a submittable .msix. This is a
# syntax check with a Windows-only validator behind it.
#
# Run release/msix/check_manifest.sh first — it catches the XML and asset mistakes locally and
# costs nothing.

on:
  workflow_dispatch:
  push:
    paths:
      - 'release/msix/**'
      - '.github/workflows/msix-manifest-check.yml'

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Placeholder identity. Ingestion demands the real values, but MakeAppx only checks that the
      # attributes are well-formed, so the repository variables are not needed here — which keeps
      # this workflow working on a fork and keeps the check available before Partner Center is set
      # up. The Publisher string still has to parse as a distinguished name.
      - name: Stage a dummy payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/store
          printf 'not a real executable' > build/store/Lothal.exe
          printf 'not a real pack'       > build/store/Lothal.pck
          printf 'not a real library'    > build/store/lothal_core.dll

      - name: Validate the manifest with MakeAppx
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ManifestCheck.Lothal
          MSIX_IDENTITY_PUBLISHER: CN=00000000-0000-0000-0000-000000000000
          MSIX_PUBLISHER_DISPLAY_NAME: Manifest Check
        run: ./release/msix/package_msix.ps1

      # No artifact upload. The .msix this produces contains dummy bytes and must never be
      # mistaken for something submittable — leaving it downloadable is the whole risk.
      - name: Report
        shell: bash
        run: echo "manifest validated by MakeAppx; the package itself is dummy content and was discarded"
