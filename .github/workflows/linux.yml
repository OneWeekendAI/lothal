name: linux-build

# Linux counterpart to windows.yml. Builds the Rust core for Linux, runs the test suite under
# Godot on a Linux runner, and uploads the exported build as an artifact. Signing and bucket
# upload stay out of CI for the same reasons documented in windows.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being built, e.g. 0.3.0 (labels the artifact only)"
        required: true
        default: "0.0.0-dev"
  push:
    branches:
      - main
      - "linux-**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_TEMPLATE_DIR: "4.7.1.stable"

jobs:
  build:
    runs-on: ubuntu-latest
    # A job that hangs rather than fails burns the 6-hour default before anyone sees it, and
    # this pipeline has a known way to hang: with the GDExtension unloaded the test runner dies
    # inside its own reporting loop without reaching quit(). The "Assert the Rust core loaded"
    # step below catches that specific case in seconds; this is the backstop for the ones nobody
    # has met yet. A cold cargo build plus a full suite is ~15 min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # ---- Rust core -----------------------------------------------------
      - name: Install Rust
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          # Without this a lockfile bump throws away the whole cache and rebuilds every
          # dependency from scratch — rsa and the godot bindings are most of the ~7 min.
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build liblothal_core.so
        working-directory: rust
        run: cargo build --release --target x86_64-unknown-linux-gnu

      # The .gdextension points at res://build/liblothal_core.so. Copy rather than symlink so
      # the export reads it as a project resource.
      - name: Stage the .so where the extension expects it
        run: |
          mkdir -p build
          cp rust/target/x86_64-unknown-linux-gnu/release/liblothal_core.so build/
          ls -l build/liblothal_core.so

      # ---- Godot ---------------------------------------------------------
      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSLO "$BASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSLO "$BASE/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"
          ln -sf "$HOME/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$HOME/godot/godot"
          TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          mkdir -p "$TEMPLATES"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" -d "$HOME/tpz"
          cp "$HOME"/tpz/templates/* "$TEMPLATES/"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      # Import once before anything else touches the project. A cold checkout has no .godot/
      # cache, and both the test run and the export will otherwise operate on a project whose
      # resources have not been imported yet.
      - name: Import resources
        timeout-minutes: 15
        run: godot --headless --import || true

      # Diagnostic: prints the feature tags Godot reports, so a failing .gdextension library
      # match can be read off the log (every tag in "linux.debug.x86_64" must be reported).
      - name: Diagnostic - Godot feature tags
        timeout-minutes: 5
        run: godot --headless --path . --script res://tools/print_features.gd || true

      # The gate the suite below CANNOT be: if the extension did not load, run_tests.gd does
      # not fail, it hangs. The missing types come back as parse errors, a suite returns null,
      # and the runner dies inside its own reporting loop without ever reaching quit() — the
      # job then sits there until a timeout, which reads like a CI flake rather than a missing
      # .so. This exits 1 in seconds and names the cause. It goes BEFORE the suite so a broken
      # core is one red step, not forty minutes of nothing.
      #
      # Linux needs this as much as Windows did, and for a reason that is not hypothetical: the
      # `;`-vs-`#` comment bug in lothal.gdextension made Godot's ConfigFile parser drop every
      # key below the first comment. That is a whole-file failure mode — it took Windows out
      # while macOS was fine, and the Linux keys sit below the same comments.
      - name: Assert the Rust core loaded
        timeout-minutes: 5
        run: godot --headless --path . --script res://tools/assert_core_loaded.gd

      - name: Run the test suite on Linux
        timeout-minutes: 20
        run: godot --headless --script res://tests/run_tests.gd

      - name: Export Linux build
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/Lothal.x86_64 || \
            godot --headless --export-release "Linux/X11" build/linux/Lothal.x86_64
          test -f build/linux/Lothal.x86_64 || { echo "export produced no executable"; exit 1; }
          ls -l build/linux

      # Assert the core actually travelled with the export. The failure this catches is a build
      # that starts and then has no powertrain — which looks like a working download right up
      # until someone tries to fly.
      #
      # The .pck is checked on the same grounds: this preset does not embed it, so an executable
      # that travels alone starts and then dies complaining about a missing main scene. Both
      # files have to be in the artifact for the zip a human packages from it to be a working
      # build. package.sh re-checks all of this, but finding it here costs one red step instead
      # of a download, a cargo build and a release attempt.
      - name: Verify the native core and the pack shipped
        run: |
          missing=()
          ls build/linux | grep -qi 'liblothal_core.so' || missing+=("liblothal_core.so — the export dropped the GDExtension")
          ls build/linux | grep -qi 'Lothal.pck'        || missing+=("Lothal.pck — the executable cannot start without its pack")
          if [ ${#missing[@]} -ne 0 ]; then
            printf 'error: missing beside Lothal.x86_64: %s\n' "${missing[@]}" >&2
            ls -R build/linux >&2
            exit 1
          fi

      # Note for whoever packages from this: actions/upload-artifact does NOT preserve the
      # executable bit, so Lothal.x86_64 arrives on the Mac as mode 644. release/package.sh
      # restores it before zipping and asserts it survived into the archive — without that, the
      # user's experience is a double-click that does nothing, silently.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lothal-linux-x64-${{ github.event.inputs.version || github.ref_name }}
          path: build/linux/
          if-no-files-found: error
