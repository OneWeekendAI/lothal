name: windows-build

# Produces the Windows half of a release: the Rust core compiled for Windows, and the Godot
# export that loads it. It uploads an artifact and stops there.
#
# ---------------------------------------------------------------------------
# WHY THIS EXISTS AT ALL, WHEN build_windows.sh ALREADY CROSS-EXPORTS FROM A MAC
# ---------------------------------------------------------------------------
#
# Godot exports Windows from any host, so the .exe was never the problem. The Rust core is.
# rust/ compiles to a cdylib that owns the powertrain and the battery and motor models, and the
# GDScript implementations of all of it were deleted when the port landed.
# There is no "Windows build minus the native core" that is worth shipping — it is an app with
# no physics.
#
# That .dll could in principle be cross-compiled from macOS via mingw. The reason it is not is
# that nothing on a Mac can RUN the result. The test suite is the only thing standing between a
# refactor and a silently wrong thrust curve, and a cross-compiled artifact that has never
# executed its own tests is exactly the kind of unverified output the release scripts are
# written to refuse. A windows-latest runner compiles with the same MSVC toolchain users' own
# machines expect and runs the suite natively before anything is packaged.
#
# ---------------------------------------------------------------------------
# WHAT THIS DELIBERATELY DOES NOT DO
# ---------------------------------------------------------------------------
#
# It does not sign the manifest and it does not touch the bucket. release/package.sh signs with
# a private key that lives on one machine and is deliberately not a CI secret, and
# release/upload.sh is the only thing that writes to the public bucket. Splitting those two off
# from the build is the existing design; putting the update-signing key into a GitHub secret
# would undo it, because a compromised workflow would then be able to sign a release. CI hands
# back a zip; a human runs package.sh and upload.sh.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being built, e.g. 0.3.0 (labels the artifact only)"
        required: true
        default: "0.0.0-dev"

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_TEMPLATE_DIR: "4.7.1.stable"

jobs:
  build:
    runs-on: windows-latest
    # A job that hangs rather than fails burns the 6-hour default before anyone sees it, and
    # this pipeline has a known way to hang: with the GDExtension unloaded the test runner
    # dies inside its own reporting loop without reaching quit(). The "Assert the Rust core
    # loaded" step below catches that specific case in seconds; this is the backstop for the
    # ones nobody has met yet. A cold cargo build plus a full suite is ~15 min.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ---- Rust core -----------------------------------------------------
      # The runner ships a Rust toolchain and the MSVC build tools already; pinning the
      # toolchain file rather than a version here keeps CI and the Mac on the same compiler.
      - name: Install Rust (MSVC)
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          # Without this a lockfile bump throws away the whole cache and rebuilds every
          # dependency from scratch — rsa and the godot bindings are most of the ~7 min.
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build lothal_core.dll
        working-directory: rust
        shell: bash
        # Same path scrub as build_macos.sh: panic strings embed source paths, so without the
        # remap the .dll ships C:\Users\runneradmin\.cargo\registry\... and the checkout path.
        # cygpath -w because rustc sees Windows-native paths, not the MSYS /c/ spelling.
        run: |
          set -euo pipefail
          SYSROOT="$(rustc --print sysroot)"
          CARGO_H="$(cygpath -w "${CARGO_HOME:-$HOME/.cargo}")"
          RUSTUP_H="$(cygpath -w "${RUSTUP_HOME:-$HOME/.rustup}")"
          REPO="$(cygpath -w "$GITHUB_WORKSPACE")"
          export RUSTFLAGS="--remap-path-prefix=$CARGO_H=/cargo --remap-path-prefix=$RUSTUP_H=/rustup --remap-path-prefix=$SYSROOT=/rustc-sysroot --remap-path-prefix=$REPO=/lothal"
          echo "RUSTFLAGS=$RUSTFLAGS"
          cargo build --release --target x86_64-pc-windows-msvc
      - name: Assert no build-machine paths in the .dll
        shell: bash
        run: |
          if grep -a -c -i -E 'runneradmin|\\.cargo\\registry|/\.cargo/registry' rust/target/x86_64-pc-windows-msvc/release/lothal_core.dll; then
            echo "error: lothal_core.dll still carries build-machine paths" >&2; exit 1
          fi

      # The .gdextension points at res://build/lothal_core.dll. Copying rather than symlinking
      # because the export reads it as a project resource.
      - name: Stage the .dll where the extension expects it
        shell: bash
        run: |
          mkdir -p build
          cp rust/target/x86_64-pc-windows-msvc/release/lothal_core.dll build/
          ls -l build/lothal_core.dll

      # ---- Godot ---------------------------------------------------------
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSLO "$BASE/Godot_v${GODOT_RELEASE}_win64.exe.zip"
          curl -fsSLO "$BASE/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          7z x "Godot_v${GODOT_RELEASE}_win64.exe.zip" -o"$HOME/godot" >/dev/null
          TEMPLATES="$APPDATA/Godot/export_templates/${GODOT_TEMPLATE_DIR}"
          mkdir -p "$TEMPLATES"
          7z x "Godot_v${GODOT_RELEASE}_export_templates.tpz" -o"$HOME/tpz" >/dev/null
          cp "$HOME"/tpz/templates/* "$TEMPLATES/"
          # Export the binary as an absolute path rather than putting $HOME/godot on
          # $GITHUB_PATH. $HOME here is an MSYS path (/c/Users/runneradmin), and $GITHUB_PATH
          # entries are spliced into the *native* Windows PATH, where that form does not
          # resolve — it happens to work from `shell: bash` steps and silently would not from
          # any other shell. One variable, used verbatim below, has no such edge.
          echo "GODOT=$HOME/godot/Godot_v${GODOT_RELEASE}_win64_console.exe" >> "$GITHUB_ENV"
          ls -l "$HOME/godot"

      # Import once before anything else touches the project. A cold checkout has no .godot/
      # cache, and both the test run and the export will otherwise operate on a project whose
      # resources have not been imported yet.
      - name: Import resources
        shell: bash
        timeout-minutes: 15
        run: |
          "$GODOT" --headless --import || true

      # Diagnostic: prints the feature tags Godot reports, so a failing .gdextension library
      # match can be read off the log (every tag in "windows.debug.x86_64" must be reported).
      - name: Diagnostic - Godot feature tags
        shell: bash
        timeout-minutes: 5
        run: |
          "$GODOT" --headless --path . --script res://tools/print_features.gd || true

      # The gate the suite below CANNOT be: if the extension did not load, run_tests.gd does
      # not fail, it hangs. The missing types come back as parse errors, a suite returns null,
      # and the runner dies inside its own reporting loop without ever reaching quit() — the
      # job then sits there until a timeout, which reads like a CI flake rather than a missing
      # .dll. This exits 1 in seconds and names the cause. It goes BEFORE the suite so a
      # broken core is one red step, not forty minutes of nothing.
      - name: Assert the Rust core loaded
        shell: bash
        timeout-minutes: 5
        run: |
          "$GODOT" --headless --path . --script res://tools/assert_core_loaded.gd

      # The whole reason this job runs on Windows rather than cross-compiling. If the native
      # core misbehaves under MSVC, it fails here rather than on a user's machine.
      - name: Run the test suite on Windows
        shell: bash
        timeout-minutes: 20
        run: |
          "$GODOT" --headless --script res://tests/run_tests.gd

      - name: Export Windows build
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p build/windows
          "$GODOT" --headless \
            --export-release "Windows Desktop" build/windows/Lothal.exe
          test -f build/windows/Lothal.exe || { echo "export produced no executable"; exit 1; }
          ls -l build/windows

      # Assert the core actually travelled with the export. The failure this catches is a build
      # that starts and then has no powertrain — which looks like a working download right up
      # until someone tries to fly.
      #
      # The .pck is checked on the same grounds: this preset does not embed it, so an .exe that
      # travels alone starts and then dies complaining about a missing main scene. Both files
      # have to be in the artifact for the zip a human packages from it to be a working build.
      - name: Verify the native core and the pack shipped
        shell: bash
        run: |
          missing=()
          ls build/windows | grep -qi 'lothal_core.dll' || missing+=("lothal_core.dll — the export dropped the GDExtension")
          ls build/windows | grep -qi 'Lothal.pck'      || missing+=("Lothal.pck — the .exe cannot start without its pack")
          if [ ${#missing[@]} -ne 0 ]; then
            printf 'error: missing beside the .exe: %s\n' "${missing[@]}" >&2
            ls -R build/windows >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lothal-windows-x64-${{ github.event.inputs.version || github.ref_name }}
          path: build/windows/
          if-no-files-found: error

