name: windows-build

# Produces the Windows half of a release: the Rust core compiled for Windows, and the Godot
# export that loads it. It uploads an artifact and stops there.
#
# ---------------------------------------------------------------------------
# WHY THIS EXISTS AT ALL, WHEN build_windows.sh ALREADY CROSS-EXPORTS FROM A MAC
# ---------------------------------------------------------------------------
#
# Godot exports Windows from any host, so the .exe was never the problem. The Rust core is.
# rust/ compiles to a cdylib that owns the powertrain, the battery and motor models, and the
# licence gate, and the GDScript implementations of all of it were deleted when the port landed.
# There is no "Windows build minus the native core" that is worth shipping — it is an app with
# no physics that also cannot be activated.
#
# That .dll could in principle be cross-compiled from macOS via mingw. The reason it is not is
# that nothing on a Mac can RUN the result. The test suite is the only thing standing between a
# refactor and a silently wrong thrust curve, and a cross-compiled artifact that has never
# executed its own tests is exactly the kind of unverified output the release scripts are
# written to refuse. A windows-latest runner compiles with the same MSVC toolchain users' own
# machines expect and runs the suite natively before anything is packaged.
#
# ---------------------------------------------------------------------------
# WHAT THIS DELIBERATELY DOES NOT DO
# ---------------------------------------------------------------------------
#
# It does not sign the manifest and it does not touch the bucket. release/package.sh signs with
# a private key that lives on one machine and is deliberately not a CI secret, and
# release/upload.sh is the only thing that writes to the public bucket. Splitting those two off
# from the build is the existing design; putting the update-signing key into a GitHub secret
# would undo it, because a compromised workflow would then be able to sign a release. CI hands
# back a zip; a human runs package.sh and upload.sh.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being built, e.g. 0.3.0 (labels the artifact only)"
        required: true
        default: "0.0.0-dev"

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_TEMPLATE_DIR: "4.7.1.stable"

jobs:
  build:
    runs-on: windows-latest
    # A job that hangs rather than fails burns the 6-hour default before anyone sees it, and
    # this pipeline has a known way to hang: with the GDExtension unloaded the test runner
    # dies inside its own reporting loop without reaching quit(). The "Assert the Rust core
    # loaded" step below catches that specific case in seconds; this is the backstop for the
    # ones nobody has met yet. A cold cargo build plus a full suite is ~15 min.
    # The encrypted-template compile (below) adds ~60-90 min on a hosted runner.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # ---- Rust core -----------------------------------------------------
      # The runner ships a Rust toolchain and the MSVC build tools already; pinning the
      # toolchain file rather than a version here keeps CI and the Mac on the same compiler.
      - name: Install Rust (MSVC)
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          # Without this a lockfile bump throws away the whole cache and rebuilds every
          # dependency from scratch — rsa and the godot bindings are most of the ~7 min.
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build lothal_core.dll
        working-directory: rust
        run: cargo build --release --target x86_64-pc-windows-msvc

      # The .gdextension points at res://build/lothal_core.dll. Copying rather than symlinking
      # because the export reads it as a project resource.
      - name: Stage the .dll where the extension expects it
        shell: bash
        run: |
          mkdir -p build
          cp rust/target/x86_64-pc-windows-msvc/release/lothal_core.dll build/
          ls -l build/lothal_core.dll

      # ---- Encrypted export template ------------------------------------
      # The presets have encrypt_pck=true, and a pack encrypted with a key the template does not
      # carry exports cleanly and then cannot start. The key has to be COMPILED into the
      # template, so this builds 4.7.1-stable's Windows release template from source with the
      # key from the GODOT_PCK_KEY repository secret (set once with
      # `security find-generic-password -a lothal-pck -s lothal-pck-key -w | gh secret set GODOT_PCK_KEY`).
      # scons reads it as SCRIPT_AES256_ENCRYPTION_KEY; the editor, at export, reads
      # GODOT_SCRIPT_ENCRYPTION_KEY. Both are the same 64-hex-char value.
      - name: Refuse to run without the PCK key
        shell: bash
        env:
          GODOT_SCRIPT_ENCRYPTION_KEY: ${{ secrets.GODOT_PCK_KEY }}
        run: |
          printf '%s' "$GODOT_SCRIPT_ENCRYPTION_KEY" | grep -Eq '^[0-9a-fA-F]{64}$' || {
            echo "error: secret GODOT_PCK_KEY missing or not 64 hex chars — see the comment above" >&2
            exit 1
          }

      - name: Build encrypted Windows release template
        shell: bash
        timeout-minutes: 90
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_PCK_KEY }}
        run: |
          set -euo pipefail
          python -m pip install --quiet scons
          git clone --quiet --depth 1 --branch "${GODOT_RELEASE}" \
            https://github.com/godotengine/godot.git "$RUNNER_TEMP/godot-src"
          cd "$RUNNER_TEMP/godot-src"
          # Same renderers as the official template: D3D12 (Agility SDK) and ANGLE for the
          # compatibility renderer. Without these the build silently drops both drivers.
          python misc/scripts/install_d3d12_sdk_windows.py
          python misc/scripts/install_angle.py
          scons platform=windows target=template_release arch=x86_64 production=yes
          mkdir -p "$GITHUB_WORKSPACE/build/templates"
          cp bin/godot.windows.template_release.x86_64.exe \
            "$GITHUB_WORKSPACE/build/templates/windows_release_x86_64.exe"

      # The pairing proof: the key's 32 bytes are in the binary. A mismatch here is the
      # can-never-launch build, caught before anything is exported with it.
      - name: Verify the template carries the key
        shell: bash
        env:
          GODOT_SCRIPT_ENCRYPTION_KEY: ${{ secrets.GODOT_PCK_KEY }}
        run: python release/check_template_key.py build/templates/windows_release_x86_64.exe

      # Uploaded so build_windows.sh can cross-export from the Mac: drop it at
      # ~/.lothal/templates/4.7.1.stable/windows_release_x86_64.exe. It contains the key (as
      # every shipped Lothal.exe does), so the artifact is no more secret than a release.
      - name: Upload encrypted template
        uses: actions/upload-artifact@v4
        with:
          name: lothal-windows-template-${{ github.event.inputs.version || github.ref_name }}
          path: build/templates/windows_release_x86_64.exe
          if-no-files-found: error

      # ---- Godot ---------------------------------------------------------
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSLO "$BASE/Godot_v${GODOT_RELEASE}_win64.exe.zip"
          curl -fsSLO "$BASE/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          7z x "Godot_v${GODOT_RELEASE}_win64.exe.zip" -o"$HOME/godot" >/dev/null
          TEMPLATES="$APPDATA/Godot/export_templates/${GODOT_TEMPLATE_DIR}"
          mkdir -p "$TEMPLATES"
          7z x "Godot_v${GODOT_RELEASE}_export_templates.tpz" -o"$HOME/tpz" >/dev/null
          cp "$HOME"/tpz/templates/* "$TEMPLATES/"
          # Export the binary as an absolute path rather than putting $HOME/godot on
          # $GITHUB_PATH. $HOME here is an MSYS path (/c/Users/runneradmin), and $GITHUB_PATH
          # entries are spliced into the *native* Windows PATH, where that form does not
          # resolve — it happens to work from `shell: bash` steps and silently would not from
          # any other shell. One variable, used verbatim below, has no such edge.
          echo "GODOT=$HOME/godot/Godot_v${GODOT_RELEASE}_win64_console.exe" >> "$GITHUB_ENV"
          ls -l "$HOME/godot"

      # Import once before anything else touches the project. A cold checkout has no .godot/
      # cache, and both the test run and the export will otherwise operate on a project whose
      # resources have not been imported yet.
      - name: Import resources
        shell: bash
        timeout-minutes: 15
        run: |
          "$GODOT" --headless --import || true

      # Diagnostic: prints the feature tags Godot reports, so a failing .gdextension library
      # match can be read off the log (every tag in "windows.debug.x86_64" must be reported).
      - name: Diagnostic - Godot feature tags
        shell: bash
        timeout-minutes: 5
        run: |
          "$GODOT" --headless --path . --script res://tools/print_features.gd || true

      # The gate the suite below CANNOT be: if the extension did not load, run_tests.gd does
      # not fail, it hangs. The missing types come back as parse errors, a suite returns null,
      # and the runner dies inside its own reporting loop without ever reaching quit() — the
      # job then sits there until a timeout, which reads like a CI flake rather than a missing
      # .dll. This exits 1 in seconds and names the cause. It goes BEFORE the suite so a
      # broken core is one red step, not forty minutes of nothing.
      - name: Assert the Rust core loaded
        shell: bash
        timeout-minutes: 5
        run: |
          "$GODOT" --headless --path . --script res://tools/assert_core_loaded.gd

      # The whole reason this job runs on Windows rather than cross-compiling. If the native
      # core misbehaves under MSVC, it fails here rather than on a user's machine.
      - name: Run the test suite on Windows
        shell: bash
        timeout-minutes: 20
        run: |
          "$GODOT" --headless --script res://tests/run_tests.gd

      - name: Export Windows build
        shell: bash
        timeout-minutes: 15
        env:
          GODOT_SCRIPT_ENCRYPTION_KEY: ${{ secrets.GODOT_PCK_KEY }}
        run: |
          set -euo pipefail
          mkdir -p build/windows
          "$GODOT" --headless \
            --export-release "Windows Desktop" build/windows/Lothal.exe
          test -f build/windows/Lothal.exe || { echo "export produced no executable"; exit 1; }
          ls -l build/windows

      # Assert the core actually travelled with the export. The failure this catches is a build
      # that starts and then has no powertrain — which looks like a working download right up
      # until someone tries to fly.
      #
      # The .pck is checked on the same grounds: this preset does not embed it, so an .exe that
      # travels alone starts and then dies complaining about a missing main scene. Both files
      # have to be in the artifact for the zip a human packages from it to be a working build.
      - name: Verify the native core and the pack shipped
        shell: bash
        run: |
          missing=()
          ls build/windows | grep -qi 'lothal_core.dll' || missing+=("lothal_core.dll — the export dropped the GDExtension")
          ls build/windows | grep -qi 'Lothal.pck'      || missing+=("Lothal.pck — the .exe cannot start without its pack")
          if [ ${#missing[@]} -ne 0 ]; then
            printf 'error: missing beside the .exe: %s\n' "${missing[@]}" >&2
            ls -R build/windows >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lothal-windows-x64-${{ github.event.inputs.version || github.ref_name }}
          path: build/windows/
          if-no-files-found: error

      # ---- Microsoft Store package ---------------------------------------
      # A second export rather than a repackaging of the first. The "Windows Store" preset sets
      # custom_features="store", and that tag is what removes the update bar from the build —
      # a Store app that points users at the dl.meetdev.in download is a certification failure.
      # Reusing build/windows/ here would ship the direct-download build with a Store identity
      # stamped on it, which is the one combination that fails review for a reason no log
      # explains.
      #
      # The whole Store half is skipped when the identity variables are absent, so the ordinary
      # Windows build still runs to completion on a fork or before Partner Center is set up.
      # The three values come from the product's Product Identity page and go in as repository
      # variables (Settings -> Secrets and variables -> Actions -> Variables). They are not
      # secrets — they are readable inside every copy of the installed package — but they are
      # account-specific, so they are not committed.
      - name: Export Windows Store build
        if: vars.MSIX_IDENTITY_NAME != ''
        shell: bash
        timeout-minutes: 15
        env:
          GODOT_SCRIPT_ENCRYPTION_KEY: ${{ secrets.GODOT_PCK_KEY }}
        run: |
          set -euo pipefail
          mkdir -p build/store
          "$GODOT" --headless \
            --export-release "Windows Store" build/store/Lothal.exe
          test -f build/store/Lothal.exe || { echo "store export produced no executable"; exit 1; }
          # Same two files, same reasons as the direct-download build above. package_msix.ps1
          # checks them again before it packs; this is the earlier of the two so the failure
          # names the export rather than the packaging step.
          ls build/store | grep -qi 'lothal_core.dll' || { echo "store export dropped the GDExtension"; exit 1; }
          ls build/store | grep -qi 'Lothal.pck'      || { echo "store export dropped the pack"; exit 1; }
          ls -l build/store

      # Produces an UNSIGNED .msix. That is what Partner Center wants: Microsoft signs Store
      # packages with their own certificate at ingestion, which is the reason this project can
      # ship a trusted Windows build without owning a code-signing certificate. The artifact
      # cannot be installed by double-clicking it; see the note in package_msix.ps1.
      - name: Package MSIX
        if: vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        timeout-minutes: 10
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_IDENTITY_PUBLISHER: ${{ vars.MSIX_IDENTITY_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./release/msix/package_msix.ps1

      - name: Upload MSIX artifact
        if: vars.MSIX_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: lothal-msix-${{ github.event.inputs.version || github.ref_name }}
          path: build/msix/Lothal.msix
          if-no-files-found: error
