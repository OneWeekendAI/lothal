[package]
name = "lothal_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.4", features = ["api-4-7"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"      # a panic across the FFI boundary is UB; abort instead
strip = "symbols"    # remove the symbol table — this is the point of the exercise
