[package]
name = "lothal_core"
version = "0.3.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.4", features = ["api-4-7"] }
# The spectrum (LTHL-20). Any frame length, not just powers of two: the frame is
# round(1.024 s * fs), which is 1024 at 1 kHz and 8192 at 8 kHz but nothing so tidy at the rates
# a Betaflight log arrives at. A hand-rolled radix-2 would have to reject those.
rustfft = "6.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"      # a panic across the FFI boundary is UB; abort instead
strip = "symbols"    # smaller release binary
